name: Check and publish workshop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - name: Install site dependencies
        run: python -m pip install -r requirements.txt
      - name: Test the live planner
        run: npm test
      - name: Test the link checker
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build the workshop
        run: python -m mkdocs build --strict
      - name: Check generated local links and fragments
        run: python scripts/check_links.py
      - name: Upload the checked site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Publish the checked artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
